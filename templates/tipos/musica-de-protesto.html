
{% for musica in musicas %}
    <article class="card"
             data-category="musica-de-protesto"
             data-genero="{{ musica.genero }}">

        <img src="{{ url_for('static', filename=musica.imagem) }}"
             alt="{{ musica.titulo }}">

        <div class="card-content">
            <span class="badge genero-badge">Música de protesto</span>
            <h3 class="titulo">{{ musica.titulo }}</h3>
            <p class="autor">Artista: {{ musica.artista }}</p>
            <p class="descricao">{{ musica.descricao }}</p>
            <p class="detalhes">
                Lançamento: {{ musica.ano_lancamento }}
            </p>
        </div>
    </article>
{% endfor %}
